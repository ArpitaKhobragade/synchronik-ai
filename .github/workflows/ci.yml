# Backend tests run twice: on SQLite and against a real PostgreSQL service container.
# No secrets are needed: tests use fake embedding / reranker / LLM providers.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password   # throwaway container credential, not a secret
          POSTGRES_DB: synchronik_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Import check
        run: python -c "import backend.main"
      - name: Tests (${{ matrix.database }})
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg2://ci:ci-only-password@localhost:5432/synchronik_test' || '' }}
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://ci-placeholder.invalid   # the build refuses to bundle without a non-local API URL
